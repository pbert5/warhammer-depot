<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Warhammer Tools</title>
    <style>body{margin:0;min-height:100vh;background:#111827;color:#f9fafb;font:16px system-ui,sans-serif;display:grid;place-items:center}main{width:min(760px,calc(100% - 32px))}h1{font-size:clamp(2rem,7vw,4rem);margin:0 0 2rem}section{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}a{display:block;padding:1.5rem;border:1px solid #374151;border-radius:14px;background:#1f2937;color:inherit;text-decoration:none}a:hover{border-color:#f59e0b;transform:translateY(-2px)}h2{margin:0 0 .5rem;font-size:1.25rem}p{color:#cbd5e1;margin:0}</style>
  </head>
  <body><main><h1>Warhammer Tools</h1><section>
    <a id="depot" href="#"><h2>Warhammer 40,000 / Depot</h2><p>Army lists, datasheets, collections</p></a>
    <a id="munda" href="#"><h2>Necromunda / Munda Manager</h2><p>Gang management</p></a>
  </section></main><script>const u=new URL(location.href);const link=(port)=>{const n=new URL(u);n.port=port;n.pathname='/';n.search='';n.hash='';return n.href};document.querySelector('#depot').href=link('19096');document.querySelector('#munda').href=link('19097');</script></body>
</html>
